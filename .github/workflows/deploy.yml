# Builds the site and deploys it to GitHub Pages.
#
# Trigger: push to `main` only. Pushes/PRs to `develop` (or any other
# branch) do NOT deploy. To ship: merge develop → main.
#
# Stable URL once enabled: https://fabioduque.github.io/principles-of-flight-studies/
#
# One-time repo setting required (only the first time):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Ensure only one Pages deploy runs at a time; cancel in-progress runs
# if a newer commit lands while an older build is still going.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
